name: Contribution snake

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#0a0a0a&color_dots=#ebedf0,#c6c6c6,#8c8c8c,#4a4a4a,#0a0a0a
            dist/snake-dark.svg?palette=github-dark&color_snake=#f2f2f2&color_dots=#161b22,#3a3a3a,#6e6e6e,#a8a8a8,#f2f2f2

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: Update contribution snake
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
